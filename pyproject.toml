[project]
name = "alpha-mining"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deap>=1.4.4",
    "numpy>=2.4.6",
    "openai>=3.33.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_mining"]

[tool.pytest.ini_options]
testpaths = ["tests"]
